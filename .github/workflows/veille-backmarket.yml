# À placer dans le dépôt sous : .github/workflows/veille-backmarket.yml
name: Veille Back Market

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 minutes
  workflow_dispatch:          # bouton « Run workflow » pour tester
    inputs:
      test:
        description: "Envoyer le bilan et le graphique même sans bonne affaire"
        type: boolean
        default: true
      reconstituer:
        description: "Récupérer les prix des passages précédents (à faire une fois)"
        type: boolean
        default: false

permissions:
  contents: write   # enregistrer historique.csv, historique.png et README.md
  actions: read     # relire les logs des passages précédents

env:
  PLAFOND_TRES_BON: "770"   # prix maximum en Très bon état
  PLAFOND_PARFAIT: "790"    # prix maximum en Parfait état

concurrency:
  group: veille-backmarket
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Playwright et matplotlib
        run: |
          pip install --quiet playwright matplotlib
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          command -v google-chrome >/dev/null || python -m playwright install --with-deps chromium

      - name: Récupérer la mémoire des alertes déjà envoyées
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: veille-${{ github.run_id }}
          restore-keys: veille-

      - name: Vérifier Back Market
        id: veille
        env:
          # Tous les secrets du dépôt (TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, NTFY_TOPIC…) :
          # plus besoin de modifier ce fichier pour en ajouter un.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          MODE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: xvfb-run -a python watch.py

      - name: Sauvegarder la mémoire des alertes
        if: always() && steps.veille.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: veille-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enregistrer l'historique des prix
        if: always() && steps.veille.outcome != 'skipped'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          GITHUB_TOKEN: ${{ github.token }}
          RECONSTITUER: ${{ github.event_name == 'workflow_dispatch' && inputs.reconstituer }}
        run: |
          if [ "$RECONSTITUER" = "true" ]; then python historique.py reconstituer; fi
          python historique.py ajouter
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique.csv
          [ -f historique.png ] && git add historique.png README.md
          if git diff --cached --quiet; then
            echo "Historique inchangé."
          else
            git commit --quiet -m "Relevé de prix du $(TZ=Europe/Paris date '+%d/%m %Hh%M')"
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" || true
            git push --quiet origin "HEAD:$GITHUB_REF_NAME"
            echo "Historique enregistré dans le dépôt."
          fi
